[package]
name = "pwss"
version = "0.2.1"
edition = "2024"
description = "Painless WordPress Security for Servers: a read-only malware, persistence and server-health scanner for Linux hosts running many WordPress sites"
license = "GPL-3.0-or-later"
readme = "README.md"
keywords = ["wordpress", "security", "malware", "scanner", "cli"]
categories = ["command-line-utilities"]

[dependencies]
aho-corasick = "1.1.5"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.191"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
toml = "1.1.8"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
